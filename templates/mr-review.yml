elementary-mr-review:
  image: node:22-slim

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "models/**/*.sql"
        - "models/**/*.yml"
        - "dbt_project.yml"
      when: always
    - when: never

  allow_failure: true

  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl
    - npm install -g @anthropic-ai/claude-code
    - |
      if [ -n "${ELEMENTARY_CI_MCP_CONFIG_PATH:-}" ]; then
        export MCP_CONFIG_PATH="${ELEMENTARY_CI_MCP_CONFIG_PATH}"
      else
        printf '{"mcpServers":{"elementary":{"url":"https://prod.api.elementary-data.com/mcp/","headers":{"Authorization":"Bearer %s"}}}}\n' \
          "${ELEMENTARY_API_KEY}" > /tmp/elementary-mcp.json
        export MCP_CONFIG_PATH="/tmp/elementary-mcp.json"
      fi

  script:
    - |
      MODELS_PATH="${ELEMENTARY_CI_MODELS_PATH:-models/}"
      DIFF_FILTER="${ELEMENTARY_CI_DIFF_FILTER:-ACM}"

      git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

      DIFF=$(git diff \
        --diff-filter=${DIFF_FILTER} \
        origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD \
        -- ${MODELS_PATH})

      export DIFF
      export COMMENT_MARKER="<!-- elementary-mr-review -->"
      export POST_COMMENT_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      export LIST_COMMENTS_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      export UPDATE_COMMENT_URL_TPL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/{id}"
      export AUTH_HEADER_NAME="PRIVATE-TOKEN"
      export AUTH_HEADER_VALUE="${GITLAB_API_TOKEN}"
      export CLAUDE_MODEL="${ELEMENTARY_CI_CLAUDE_MODEL:-claude-haiku-4-5-20251001}"

      SCRIPT_TAG="${ELEMENTARY_CI_SCRIPT_TAG:-v1}"
      curl -fsSL \
        "https://raw.githubusercontent.com/joostboon/elementary-ci/${SCRIPT_TAG}/scripts/review.sh" \
        -o /tmp/elementary_review.sh
      bash /tmp/elementary_review.sh
