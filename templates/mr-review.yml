elementary-mr-review:
  image: node:22-slim

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "models/**/*.sql"
        - "models/**/*.yml"
        - "dbt_project.yml"
      when: always
    - when: never

  allow_failure: true

  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl jq

  script:
    - |
      MODELS_PATH="${ELEMENTARY_CI_MODELS_PATH:-models/}"
      DIFF_FILTER="${ELEMENTARY_CI_DIFF_FILTER:-ACMR}"

      git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

      DIFF=$(git diff \
        --diff-filter=${DIFF_FILTER} \
        origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}...HEAD \
        -- ${MODELS_PATH})

      export DIFF
      export COMMENT_MARKER="<!-- elementary-mr-review -->"
      export POST_COMMENT_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      export LIST_COMMENTS_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      export UPDATE_COMMENT_URL_TPL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/{id}"
      if [ -n "${GITLAB_API_TOKEN:-}" ]; then
        export AUTH_HEADER_NAME="PRIVATE-TOKEN"
        export AUTH_HEADER_VALUE="${GITLAB_API_TOKEN}"
      else
        export AUTH_HEADER_NAME="JOB-TOKEN"
        export AUTH_HEADER_VALUE="${CI_JOB_TOKEN}"
      fi

      SCRIPT_TAG="${ELEMENTARY_CI_SCRIPT_TAG:-v1}"
      curl -fsSL \
        "https://raw.githubusercontent.com/elementary-data/elementary-ci/${SCRIPT_TAG}/scripts/review.sh" \
        -o /tmp/elementary_review.sh
      bash /tmp/elementary_review.sh
